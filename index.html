<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adaptations — Mes applications</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1b2d;
    --card-bg: #1a2d45;
    --card-hover: #223556;
    --accent1: #f9c74f;
    --accent2: #90e0ef;
    --accent3: #f07167;
    --accent4: #43aa8b;
    --accent5: #c77dff;
    --text: #e8f4fd;
    --subtext: #8ab4c9;
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
    --radius: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(144,224,239,0.07) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(249,199,79,0.07) 0%, transparent 50%),
      radial-gradient(ellipse at 60% 80%, rgba(192,125,255,0.06) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .contact {
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 20;
    background: rgba(26,45,69,0.85);
    border: 1px solid rgba(144,224,239,0.18);
    border-radius: 12px;
    padding: 8px 14px;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--subtext);
    line-height: 1.5;
    backdrop-filter: blur(6px);
  }
  .contact strong { color: var(--accent2); display: block; font-size: 0.8rem; }
  .contact a { color: var(--subtext); text-decoration: none; }
  .contact a:hover { color: var(--accent1); }

  header {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 74px 20px 6px;
  }
  header h1 {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.9rem, 4.5vw, 3.1rem);
    color: var(--accent1);
    letter-spacing: 0.02em;
    text-shadow: 0 2px 20px rgba(249,199,79,0.4);
  }
  header p {
    color: var(--subtext);
    font-size: 0.95rem;
    margin-top: 6px;
    font-weight: 600;
  }

  main {
    position: relative;
    z-index: 1;
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 26px;
    padding: 28px 32px 40px;
    max-width: 1400px;
    margin: 0 auto;
    width: 100%;
    align-content: start;
  }
  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.22s cubic-bezier(.34,1.56,.64,1), box-shadow 0.22s ease, background 0.18s ease;
    text-decoration: none;
    display: flex;
    flex-direction: column;
    border: 2px solid transparent;
    animation: fadeUp 0.5s ease both;
  }
  .card:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 0 2px var(--color);
    background: var(--card-hover);
  }
  .card:active { transform: translateY(-2px) scale(0.98); }
  .thumb-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16/10;
    overflow: hidden;
    background: #0d1e33;
  }
  .thumb-wrap::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, transparent 62%, rgba(10,20,38,0.72));
    z-index: 1;
    pointer-events: none;
  }
  .thumb {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
    transition: transform 0.4s ease;
  }
  .card:hover .thumb { transform: scale(1.05); }
  .badge {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 2;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--color);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.05rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.35);
  }
  .card-body {
    padding: 16px 18px 18px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    flex: 1;
  }
  .card-title {
    font-family: 'Fredoka One', cursive;
    font-size: 1.25rem;
    color: var(--text);
    line-height: 1.2;
  }
  .card-sub {
    font-size: 0.72rem;
    font-weight: 800;
    color: var(--color);
    text-transform: uppercase;
    letter-spacing: 0.09em;
  }
  .card-desc {
    font-size: 0.84rem;
    color: var(--subtext);
    line-height: 1.45;
    font-weight: 600;
  }
  .card-arrow {
    margin-top: auto;
    padding-top: 12px;
    font-size: 0.8rem;
    color: var(--subtext);
    display: flex;
    align-items: center;
    gap: 5px;
    font-weight: 700;
    transition: color 0.2s;
  }
  .card:hover .card-arrow { color: var(--color); }
  .card-arrow svg { transition: transform 0.2s; }
  .card:hover .card-arrow svg { transform: translateX(4px); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card:nth-child(1) { animation-delay: 0.05s; }
  .card:nth-child(2) { animation-delay: 0.13s; }
  .card:nth-child(3) { animation-delay: 0.21s; }
  .card:nth-child(4) { animation-delay: 0.29s; }

  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 6px 10px 18px;
    font-size: 0.72rem;
    color: #3a5070;
  }

  /* Outil de recadrage des miniatures */
  #editBtn {
    position: fixed;
    bottom: 14px;
    left: 14px;
    z-index: 30;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid rgba(144,224,239,0.25);
    background: rgba(26,45,69,0.9);
    color: var(--subtext);
    font-size: 1.1rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  #editBtn:hover { color: var(--accent1); transform: scale(1.08); }
  body.editing #editBtn { background: var(--accent1); color: #0f1b2d; border-color: var(--accent1); }
  body.editing .card { cursor: grab; }
  body.editing .card:hover { transform: none; }
  #editHint {
    position: fixed;
    bottom: 20px;
    left: 66px;
    z-index: 30;
    display: none;
    background: rgba(26,45,69,0.92);
    border: 1px solid rgba(249,199,79,0.35);
    border-radius: 10px;
    padding: 7px 12px;
    font-size: 0.74rem;
    font-weight: 700;
    color: var(--accent1);
  }
  body.editing #editHint { display: block; }

  @media (max-width: 700px) {
    main { grid-template-columns: 1fr; gap: 16px; padding: 16px; }
    header { padding: 80px 14px 4px; }
    .contact { font-size: 0.66rem; padding: 6px 10px; }
  }
</style>
</head>

const POS_KEY = 'adaptGaleriePositions';
let positions = {};
try { positions = JSON.parse(localStorage.getItem(POS_KEY) || '{}'); } catch(e) { positions = {}; }

const grid = document.getElementById('grid');

apps.forEach(app => {
  const a = document.createElement('a');
  a.href = app.url;
  a.target = '_blank';
  a.rel = 'noopener';
  a.className = 'card';
  a.dataset.key = app.key;
  a.style.setProperty('--color', app.color);
  a.innerHTML = `
    <div class="thumb-wrap">
      <img class="thumb" src="${app.img}" alt="${app.title}">
      <div class="badge">${app.emoji}</div>
    </div>
    <div class="card-body">
      <div class="card-title">${app.title}</div>
      <div class="card-sub">${app.sub}</div>
      <div class="card-desc">${app.desc}</div>
      <div class="card-arrow">
        Ouvrir
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
        </svg>
      </div>
    </div>
  `;
  const img = a.querySelector('.thumb');
  if (positions[app.key]) img.style.objectPosition = positions[app.key];
  grid.appendChild(a);
});

/* ---- Recadrage des miniatures ---- */
let editing = false;
const editBtn = document.getElementById('editBtn');

editBtn.addEventListener('click', () => {
  editing = !editing;
  document.body.classList.toggle('editing', editing);
});

document.querySelectorAll('.card').forEach(card => {
  card.addEventListener('click', e => { if (editing) e.preventDefault(); });

  const img = card.querySelector('.thumb');
  let dragging = false, startY = 0, startX = 0, curX = 50, curY = 0;

  const parsePos = () => {
    const p = (img.style.objectPosition || 'center top').split(' ');
    curX = p[0] === 'center' ? 50 : parseFloat(p[0]) || 50;
    curY = p[1] === 'top' ? 0 : (p[1] === 'bottom' ? 100 : parseFloat(p[1]) || 0);
  };

  const start = (x, y) => {
    if (!editing) return;
    dragging = true; startX = x; startY = y; parsePos();
  };
  const move = (x, y) => {
    if (!dragging) return;
    const nx = Math.max(0, Math.min(100, curX - (x - startX) * 0.25));
    const ny = Math.max(0, Math.min(100, curY - (y - startY) * 0.25));
    img.style.objectPosition = nx + '% ' + ny + '%';
  };
  const end = () => {
    if (!dragging) return;
    dragging = false;
    positions[card.dataset.key] = img.style.objectPosition;
    try { localStorage.setItem(POS_KEY, JSON.stringify(positions)); } catch(e) {}
  };

  card.addEventListener('mousedown', e => { if (editing) { e.preventDefault(); start(e.clientX, e.clientY); } });
  window.addEventListener('mousemove', e => move(e.clientX, e.clientY));
  window.addEventListener('mouseup', end);

  card.addEventListener('touchstart', e => { if (editing) { start(e.touches[0].clientX, e.touches[0].clientY); } }, {passive:true});
  card.addEventListener('touchmove', e => { if (dragging) { e.preventDefault(); move(e.touches[0].clientX, e.touches[0].clientY); } }, {passive:false});
  card.addEventListener('touchend', end);
});
</script>
